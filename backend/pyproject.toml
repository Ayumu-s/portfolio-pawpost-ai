[project]
name = "pawpost-ai-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic-settings>=2.7,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "httpx>=0.28,<1.0",
    "Pillow>=10.4",
    "pillow-heif>=0.18",
    "opencv-python-headless>=4.10,<5.0",
]

[tool.vercel]
entrypoint = "api.index:app"
